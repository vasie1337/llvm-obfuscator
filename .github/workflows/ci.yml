name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  LLVM_VERSION: "20"
  BUILD_DIR: build

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Linux — build & test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM ${{ env.LLVM_VERSION }}
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ca-certificates curl gnupg
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo gpg --dearmor -o /etc/apt/keyrings/llvm.gpg
          echo "deb [signed-by=/etc/apt/keyrings/llvm.gpg] http://apt.llvm.org/noble/ llvm-toolchain-noble-${LLVM_VERSION} main" \
            | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            llvm-${LLVM_VERSION}-dev \
            clang-${LLVM_VERSION} \
            llvm-${LLVM_VERSION}-tools \
            ninja-build

      - name: Configure
        run: |
          cmake -B "$BUILD_DIR" -G Ninja \
            -DLLVM_DIR=/usr/lib/llvm-${LLVM_VERSION}/lib/cmake/llvm \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build "$BUILD_DIR"

      - name: Build standalone plugin (rustc / -Z llvm-plugins)
        run: |
          cmake -B build-standalone -G Ninja \
            -DLLVM_DIR=/usr/lib/llvm-${LLVM_VERSION}/lib/cmake/llvm \
            -DOBFUSCATOR_STANDALONE_MODULE=ON \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build-standalone

      - name: Upload plugin (Linux)
        uses: actions/upload-artifact@v4
        with:
          name: obfuscator-linux
          path: ${{ env.BUILD_DIR }}/passes/obfuscator.so

      - name: Upload standalone plugin (Linux x86_64, rustc)
        uses: actions/upload-artifact@v4
        with:
          name: obfuscator-standalone-x86_64-unknown-linux-gnu
          path: build-standalone/passes/obfuscator.so

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2025-08-06

      - name: Verify Rust example crate (standalone plugin)
        run: |
          mkdir -p rust-integration/example-crate/vendor
          cp build-standalone/passes/obfuscator.so rust-integration/example-crate/vendor/obfuscator.so
          cd rust-integration/example-crate
          cargo build --release

      - name: Behavioral tests
        run: ./tests/run_tests.sh

      - name: IR tests (FileCheck)
        run: ./tests/run_ir_tests.sh

  windows-standalone:
    name: Windows — standalone DLL + opt smoke
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: "20.1.0"

      - name: Configure
        shell: pwsh
        run: |
          $llvmCmake = Join-Path $env:LLVM_PATH "lib\cmake\llvm"
          cmake -B build-standalone -G "Visual Studio 17 2022" -A x64 `
            -DLLVM_DIR="$llvmCmake" `
            -DOBFUSCATOR_STANDALONE_MODULE=ON

      - name: Build
        run: cmake --build build-standalone --config Release

      - name: Stage DLL for artifact
        shell: pwsh
        run: |
          $dll = Get-ChildItem -Path build-standalone -Recurse -Filter obfuscator.dll | Select-Object -First 1
          if (-not $dll) { throw "obfuscator.dll not found under build-standalone" }
          Copy-Item $dll.FullName obfuscator-x86_64-pc-windows-msvc.dll

      - name: Opt smoke test
        shell: pwsh
        run: |
          $opt = Join-Path $env:LLVM_PATH "bin\opt.exe"
          & $opt --load-pass-plugin="$(Resolve-Path obfuscator-x86_64-pc-windows-msvc.dll)" `
            -passes=instsub -disable-output tests/ir/instsub_add.ll

      - name: Upload standalone plugin (Windows x86_64 MSVC)
        uses: actions/upload-artifact@v4
        with:
          name: obfuscator-standalone-x86_64-pc-windows-msvc
          path: obfuscator-x86_64-pc-windows-msvc.dll

  lint:
    name: clang-tidy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM ${{ env.LLVM_VERSION }} & clang-tidy
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ca-certificates curl gnupg
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo gpg --dearmor -o /etc/apt/keyrings/llvm.gpg
          echo "deb [signed-by=/etc/apt/keyrings/llvm.gpg] http://apt.llvm.org/noble/ llvm-toolchain-noble-${LLVM_VERSION} main" \
            | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            llvm-${LLVM_VERSION}-dev \
            clang-${LLVM_VERSION} \
            clang-tidy-${LLVM_VERSION} \
            ninja-build

      - name: Configure (compile_commands.json)
        run: |
          cmake -B "$BUILD_DIR" -G Ninja \
            -DLLVM_DIR=/usr/lib/llvm-${LLVM_VERSION}/lib/cmake/llvm \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Run clang-tidy
        run: |
          clang-tidy-${LLVM_VERSION} \
            -p "$BUILD_DIR" \
            --warnings-as-errors='*' \
            passes/src/*.cpp

  format:
    name: clang-format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install clang-format
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ca-certificates curl gnupg
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo gpg --dearmor -o /etc/apt/keyrings/llvm.gpg
          echo "deb [signed-by=/etc/apt/keyrings/llvm.gpg] http://apt.llvm.org/noble/ llvm-toolchain-noble-${LLVM_VERSION} main" \
            | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-format-${LLVM_VERSION}

      - name: Check formatting
        run: |
          find passes/src passes/include \( -name '*.cpp' -o -name '*.h' \) \
            | xargs clang-format-${LLVM_VERSION} --dry-run --Werror
