# vendor/obfuscator.so: Linux plugin (also when cross-compiling to Windows from Linux/WSL).

[target.x86_64-unknown-linux-gnu]
rustflags = ["-Z", "llvm-plugins=vendor/obfuscator.so"]

[target.x86_64-pc-windows-gnu]
linker = "x86_64-w64-mingw32-gcc"
rustflags = ["-Z", "llvm-plugins=vendor/obfuscator.so"]

[target.x86_64-pc-windows-msvc]
rustflags = []
